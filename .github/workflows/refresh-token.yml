# 인스타그램 장기 토큰은 60일 뒤 만료된다. 매주 갱신해서 Secrets 의 IG_ACCESS_TOKEN 을 새 값으로 바꾼다.
# 필요: Secrets 에 GH_PAT (이 저장소의 "Secrets: Read and write" 권한이 있는 fine-grained 토큰).
# GH_PAT 이 없으면 이 작업이 실패하고 GitHub 이 실패 메일을 보낸다 → 그때는 토큰을 직접 새로 발급해 넣으면 된다.
name: refresh-token

on:
  schedule:
    - cron: "17 0 * * 1"   # 매주 월요일 09:17 KST
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh long-lived token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "GH_PAT secret is missing"; exit 1; }
          resp=$(curl -sS --fail-with-body "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${IG_ACCESS_TOKEN}")
          new=$(echo "$resp" | python3 -c "import json,sys; print(json.load(sys.stdin)['access_token'])")
          echo "::add-mask::$new"
          days=$(echo "$resp" | python3 -c "import json,sys; print(json.load(sys.stdin)['expires_in']//86400)")
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" --body "$new"
          echo "token refreshed, valid for ${days} days"
